<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenida</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 500px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }

        h1 {
            color: #333;
        }

        .usuario {
            color: #f07c00;
            font-weight: bold;
        }

        p {
            color: #555;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background-color: #111;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>
        Bienvenido,
        <span class="usuario" th:text="${session.usuarioLogueado}"></span>
    </h1>

    <p>Ingresaste correctamente al sistema.</p>

    <a th:href="@{/logout}">Cerrar sesión</a>
</div>

</body>
</html>
